name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-web:
    name: Tests Next.js
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Valider le schéma Prisma
        run: npx prisma validate
      - name: Vérifier les types TypeScript
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Tests unitaires
        run: npm test
      - name: Build
        run: npm run build

  test-ml:
    name: Tests modèle ML
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pytest
      - run: pytest -q

  docker:
    name: Build et publication des images Docker
    needs: [test-web, test-ml]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Nom d'image en minuscules
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: Connexion à GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image web (Next.js)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ env.OWNER }}/predictfoot-web:latest
            ghcr.io/${{ env.OWNER }}/predictfoot-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Image ML (Python)
        uses: docker/build-push-action@v6
        with:
          context: ./ml
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ env.OWNER }}/predictfoot-ml:latest
            ghcr.io/${{ env.OWNER }}/predictfoot-ml:${{ github.sha }}
          cache-from: type=gha,scope=ml
          cache-to: type=gha,mode=max,scope=ml

  deploy:
    name: Migrations et déploiement
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RENDER_WEB_HOOK: ${{ secrets.RENDER_WEB_HOOK }}
      RENDER_ML_HOOK: ${{ secrets.RENDER_ML_HOOK }}
      APP_URL: ${{ secrets.APP_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Migrations Prisma sur la base de production
        if: env.DATABASE_URL != ''
        run: |
          npm ci
          npx prisma migrate deploy
      - name: Déployer le modèle ML
        if: env.RENDER_ML_HOOK != ''
        run: curl -fsS "$RENDER_ML_HOOK"
      - name: Déployer l'application web
        if: env.RENDER_WEB_HOOK != ''
        run: curl -fsS "$RENDER_WEB_HOOK"
      - name: Vérification après déploiement
        if: env.APP_URL != ''
        run: curl -fsS --max-time 30 --retry 20 --retry-delay 15 --retry-all-errors "$APP_URL/manifest.webmanifest"